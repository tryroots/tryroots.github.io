<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Roots — Quit Bad Habits & Grow</title>
<meta name="description" content="Plant a seed for every habit you want to quit. It grows every day you resist. Free on the App Store and Google Play." />
<meta property="og:title" content="Roots — Quit Bad Habits & Grow" />
<meta property="og:description" content="Plant a seed for every habit you want to quit. It grows every day you resist. Free on the App Store and Google Play." />
<meta property="og:image" content="https://tryroots.github.io/icon.png" />
<link rel="icon" href="icon.png" />
<style>
  :root { --bg:#0b0906; --fg:#f2ead8; --muted:#b5a586; --green:#4ade80; --gold:#f5c364; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { min-height:100%; background:var(--bg); color:var(--fg); font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .bg { position:fixed; inset:0; background:#0b0906 url(bg.jpg) center top / cover no-repeat; z-index:0; }
  .bg::after { content:""; position:absolute; inset:0; background:radial-gradient(ellipse 120% 80% at 50% 100%, rgba(11,9,6,.98) 0%, rgba(11,9,6,.85) 45%, rgba(11,9,6,.25) 100%); }
  main { position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding:24px 24px 48px; text-align:center; }
  .icon { width:104px; height:104px; border-radius:24px; box-shadow:0 20px 50px rgba(0,0,0,.6), 0 0 0 2px rgba(245,195,100,.35); }
  h1 { margin-top:18px; font-size:34px; letter-spacing:.22em; font-weight:800; }
  .tag { margin-top:6px; color:var(--gold); font-weight:600; font-size:16px; letter-spacing:.04em; }
  p.lead { margin:18px auto 0; max-width:340px; color:var(--muted); font-size:16px; line-height:1.45; }
  .btns { display:flex; flex-direction:column; gap:12px; width:100%; max-width:360px; margin-top:26px; }
  a.btn { display:flex; align-items:center; gap:14px; padding:14px 18px; border-radius:16px; text-decoration:none; color:var(--fg); background:#141008; border:2px solid #4a3f2c; transition:transform .12s ease; }
  a.btn:active { transform:scale(.98); }
  a.btn.primary { border-color:var(--green); background:rgba(74,222,128,.10); }
  a.btn svg { width:34px; height:34px; flex:none; }
  a.btn .t { display:flex; flex-direction:column; align-items:flex-start; line-height:1.1; }
  a.btn .s { font-size:12px; color:var(--muted); letter-spacing:.04em; }
  a.btn .b { font-size:20px; font-weight:800; }
  .free { margin-top:18px; color:var(--muted); font-size:13px; }
  .free b { color:var(--green); }
  footer { margin-top:28px; font-size:12px; color:#6f6350; }
  footer a { color:#8f8168; }
  /* On a phone's first visit only a "loading" screen shows while the store opens. */
  .opening { display:none; position:fixed; inset:0; z-index:2; background:var(--bg); flex-direction:column; align-items:center; justify-content:center; gap:22px; }
  .opening p { color:var(--muted); font-size:16px; }
  .spin { width:26px; height:26px; border-radius:50%; border:3px solid #3a3020; border-top-color:var(--green); animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  html.jump .opening { display:flex; }
  html.jump main, html.jump .bg { visibility:hidden; }
  html.tap #android, html.tap .lead { display:none; }
  html.tap #ios { padding:20px 22px; justify-content:center; }
  html.tap #ios .b { font-size:24px; }
  .taphint { display:none; margin-top:12px; color:var(--muted); font-size:14px; }
  html.tap .taphint { display:block; }
</style>
<script>
  // Decided before anything is drawn, so the full page never flashes first.
  (function () {
    var ua = navigator.userAgent || "";
    var phone = /Android|iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var seen = false;
    try { seen = sessionStorage.getItem("roots-opened") === "1"; } catch (e) {}
    // TikTok's browser on iPhone never lets a page open the App Store by itself,
    // only on a tap, so there the page goes straight to one big App Store button.
    var iosTikTok = /iPhone|iPad|iPod/i.test(ua) && /musical_ly|BytedanceWebview|TikTok/i.test(ua);
    if (iosTikTok) document.documentElement.className = "tap";
    else if (phone && !seen && !/[?&]stay\b/.test(location.search)) document.documentElement.className = "jump";
  })();
</script>
</head>
<body>
<div class="opening"><img class="icon" src="icon.png" alt="" /><div class="spin"></div><p id="opening-text">Opening the store…</p></div>
<div class="bg"></div>
<main>
  <img class="icon" src="icon.png" alt="Roots app icon" />
  <h1>ROOTS</h1>
  <div class="tag">Quit Bad Habits &amp; Grow</div>
  <p class="lead">Plant a seed for every habit you want to quit. It grows every day you resist — and dies when you don't.</p>

  <div class="btns" id="btns">
    <a class="btn" id="ios" href="https://apps.apple.com/app/id6808912952">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#f2ead8" d="M16.365 1.43c0 1.14-.42 2.2-1.24 3.12-.99 1.1-2.19 1.73-3.48 1.63a3.6 3.6 0 0 1-.03-.44c0-1.1.47-2.27 1.31-3.22.42-.48.95-.88 1.6-1.2.64-.32 1.25-.5 1.82-.53.02.21.02.42.02.64zM20.9 17.4c-.53 1.2-.78 1.74-1.46 2.8-.95 1.48-2.29 3.32-3.95 3.34-1.47.01-1.85-.96-3.85-.95-2 .01-2.42.97-3.9.95-1.66-.02-2.93-1.68-3.88-3.16C1.2 16.23.93 11.4 2.7 8.83c1.26-1.83 3.24-2.9 5.1-2.9 1.9 0 3.09 1.04 4.66 1.04 1.52 0 2.45-1.05 4.65-1.05 1.66 0 3.42.9 4.67 2.47-4.1 2.25-3.44 8.1-.88 9.01z"/></svg>
      <span class="t"><span class="s">Download on the</span><span class="b">App Store</span></span>
    </a>
    <a class="btn" id="android" href="https://play.google.com/store/apps/details?id=com.fineasbn.roots">
      <svg viewBox="0 0 100 100" aria-hidden="true"><polygon fill="#00a0ff" points="10,5 60,50 10,95"/><polygon fill="#00e28c" points="10,5 60,50 76,40"/><polygon fill="#ff3a44" points="10,95 60,50 76,60"/><polygon fill="#ffce00" points="76,40 60,50 76,60 90,50"/></svg>
      <span class="t"><span class="s">GET IT ON</span><span class="b">Google Play</span></span>
    </a>
  </div>

  <div class="taphint">Tap the button to open the App Store</div>
  <div class="free"><b>Free</b> to start · no card required</div>
  <footer><a href="https://fineasbene.github.io/roots-legal/privacy-policy.html">Privacy</a> · <a href="https://fineasbene.github.io/roots-legal/terms.html">Terms</a></footer>
</main>
<script>
  // Put the visitor's own store first and highlight it.
  var ua = navigator.userAgent || "";
  var isiOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var btns = document.getElementById("btns"), ios = document.getElementById("ios"), an = document.getElementById("android");
  if (isAndroid) { btns.insertBefore(an, ios); an.classList.add("primary"); }
  else if (isiOS) { ios.classList.add("primary"); }

  // One link for every phone: open the visitor's store app straight away,
  // with this page left behind it. ?src=tiktok (or any name) reaches Play's
  // acquisition report as utm_source and App Store Connect as campaign ct; ?stay keeps the page (for testing).
  var params = new URLSearchParams(location.search);
  var src = (params.get("src") || params.get("utm_source") || "web").replace(/[^\w-]/g, "").slice(0, 40);
  var PKG = "com.fineasbn.roots", APPLE_ID = "6808912952";
  var play = "https://play.google.com/store/apps/details?id=" + PKG +
             "&referrer=" + encodeURIComponent("utm_source=" + src + "&utm_medium=link");
  an.href = play;
  // App Store Connect campaign link: installs show per ?src= under Analytics > Sources > Campaigns.
  var appleQ = "?pt=129407612&ct=" + encodeURIComponent(src) + "&mt=8";
  ios.href = "https://apps.apple.com/app/apple-store/id" + APPLE_ID + appleQ;
  // TikTok, Instagram, Facebook and Snapchat open links in their own browser,
  // which shows the web store page instead of the store app unless asked directly.
  var inApp = /musical_ly|BytedanceWebview|TikTok|Instagram|FBAN|FBAV|Snapchat/i.test(ua);

  // Anonymous page funnel in the app's PostHog (EU): arrived, store opened,
  // store blocked, button tapped. A random id per visit, nothing about the person.
  var vid = "web-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  var os = isAndroid ? "android" : isiOS ? "ios" : "desktop";
  var browser = /musical_ly|BytedanceWebview|TikTok/i.test(ua) ? "tiktok" : /Instagram/i.test(ua) ? "instagram" :
                /FBAN|FBAV/i.test(ua) ? "facebook" : /Snapchat/i.test(ua) ? "snapchat" : "browser";
  function track(event, extra) {
    var props = { src: src, os: os, browser: browser, $current_url: location.href };
    for (var k in extra || {}) props[k] = extra[k];
    var body = JSON.stringify({ api_key: "phc_BVU4MYK2sDFCTsyh7SNQWvnqr5ScGSyUaB5fofZYBEEC", event: event, distinct_id: vid, properties: props });
    try {
      if (!(navigator.sendBeacon && navigator.sendBeacon("https://eu.i.posthog.com/capture/", new Blob([body], { type: "text/plain" }))))
        fetch("https://eu.i.posthog.com/capture/", { method: "POST", body: body, keepalive: true });
    } catch (e) {}
  }

  function openStore() {
    if (isAndroid) {
      // The Play Store app itself; a phone without it falls back to the web page.
      location.href = "intent://details?id=" + PKG + "&referrer=" + encodeURIComponent("utm_source=" + src + "&utm_medium=link") +
        "#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=" + encodeURIComponent(play) + ";end";
    } else if (isiOS) {
      location.href = (inApp ? "itms-apps://apps.apple.com/app/apple-store/id" : "https://apps.apple.com/app/apple-store/id") + APPLE_ID + appleQ;
    }
  }
  ios.addEventListener("click", function () { track("landing_button", { store: "ios" }); });
  an.addEventListener("click", function () { track("landing_button", { store: "android" }); });
  if (isAndroid) an.addEventListener("click", function (e) { e.preventDefault(); openStore(); });
  if (isiOS && inApp) ios.addEventListener("click", function (e) {
    e.preventDefault(); openStore();
    // If the app browser refuses even on a tap, its own App Store web page is the next best thing.
    setTimeout(function () { if (!document.hidden) location.href = "https://apps.apple.com/app/apple-store/id" + APPLE_ID + appleQ; }, 1500);
  });

  // Once per visit: someone who comes back from the store gets the page, not another jump.
  try { sessionStorage.setItem("roots-opened", "1"); } catch (e) {}
  var root = document.documentElement;
  function showPage() { root.className = ""; }
  track("landing_view", { auto: root.className === "jump", tap_only: root.className === "tap" });
  // On the tap-only page, the App Store taking over is the same "store opened".
  if (root.className === "tap") {
    var gone = false;
    document.addEventListener("visibilitychange", function () { if (document.hidden && !gone) { gone = true; track("landing_store_opened", { via: "tap" }); } });
  }
  if (root.className === "jump") {
    // The page going to the background means the store app took over.
    var left = false;
    document.addEventListener("visibilitychange", function () { if (document.hidden && !left) { left = true; track("landing_store_opened"); } });
    setTimeout(function () { if (!left) track("landing_store_blocked"); }, 2500);
    document.getElementById("opening-text").textContent = isAndroid ? "Opening Google Play…" : "Opening the App Store…";
    openStore();
    // Back from the store, or the store never opened (a browser that blocks it): the full page with its buttons.
    document.addEventListener("visibilitychange", function () { if (!document.hidden) showPage(); });
    window.addEventListener("pageshow", function (e) { if (e.persisted) showPage(); });
    setTimeout(function () { if (!document.hidden) showPage(); }, 2500);
  }
</script>
</body>
</html>
